<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử làm bài</title>
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/">📝 Multiple Choice Quiz</a>
            <div class="spacer"></div>
            <div class="actions">
                <a class="btn" href="/">🏠 <span class="label">Làm bài</span></a>
                <span id="auth-area" class="actions"></span>
                <button class="btn btn-icon" onclick="toggleTheme()" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện sáng/tối">🌓</button>
            </div>
        </div>
    </header>

    <main class="page">
        <h1>Lịch sử làm bài</h1>
        <div id="content"><div class="loading-state"><div class="spinner"></div></div></div>
    </main>
    <script src="common.js"></script>
    <script src="history.js"></script>
</body>
</html>
