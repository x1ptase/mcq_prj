<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Choice Quiz</title>
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">📝 Multiple Choice Quiz</div>
            <div class="progress-wrap">
                <div class="progress-meta">
                    <span>Đã làm <b id="done-count">0</b>/<b id="total-count">0</b></span>
                    <span id="progress-pct">0%</span>
                </div>
                <div class="progress-track" role="progressbar" aria-label="Tiến độ làm bài">
                    <div class="progress-correct" id="bar-correct" style="width:0"></div>
                    <div class="progress-wrong" id="bar-wrong" style="width:0"></div>
                </div>
            </div>
            <select id="course-select" class="select" aria-label="Chọn môn" onchange="selectCourse(Number(this.value))"></select>
            <div class="actions">
                <span id="auth-area" class="actions"></span>
                <button class="btn btn-icon" id="btn-theme" onclick="toggleTheme()" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện sáng/tối">🌓</button>
                <button class="btn" onclick="refreshQuiz()" id="btn-refresh">🔄 <span class="label">Làm mới</span></button>
            </div>
        </div>
    </header>

    <div class="layout">
        <main id="quiz-container">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Đang tải câu hỏi...</p>
            </div>
        </main>

        <aside class="sidebar">
            <h2>Kết quả</h2>
            <div class="score-box">
                <div class="stat ok"><strong id="stat-correct">0</strong><span>Đúng</span></div>
                <div class="stat bad"><strong id="stat-wrong">0</strong><span>Sai</span></div>
                <div class="stat"><strong id="stat-left">0</strong><span>Còn lại</span></div>
            </div>
            <h2>Câu hỏi</h2>
            <div class="nav-grid" id="nav-grid"></div>
            <div class="legend">
                <span><i style="background:var(--success)"></i>Đúng</span>
                <span><i style="background:var(--error)"></i>Sai</span>
                <span><i style="background:var(--warning)"></i>Đang chọn</span>
            </div>
        </aside>
    </div>

    <dialog id="auth-dialog" class="dialog">
        <form onsubmit="submitAuth(event)">
            <h2 id="auth-title">Đăng nhập</h2>
            <label>Tên đăng nhập
                <input id="auth-username" class="input" autocomplete="username" required minlength="3" maxlength="30">
            </label>
            <label>Mật khẩu
                <input id="auth-password" class="input" type="password" autocomplete="current-password" required minlength="6">
            </label>
            <div id="auth-error" class="form-error" role="alert"></div>
            <div class="dialog-actions">
                <button type="button" class="btn" id="auth-switch" onclick="setAuthMode(authMode === 'login' ? 'register' : 'login')"></button>
                <button type="button" class="btn" onclick="this.closest('dialog').close()">Hủy</button>
                <button type="submit" class="btn btn-primary" id="auth-submit">Đăng nhập</button>
            </div>
        </form>
    </dialog>

    <script src="common.js"></script>
    <script src="app.js"></script>
</body>
</html>
