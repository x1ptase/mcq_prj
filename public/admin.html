<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị câu hỏi</title>
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/">📝 Multiple Choice Quiz</a>
            <div class="spacer"></div>
            <div class="actions">
                <a class="btn" href="/">🏠 <span class="label">Làm bài</span></a>
                <span id="auth-area" class="actions"></span>
                <button class="btn btn-icon" onclick="toggleTheme()" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện sáng/tối">🌓</button>
            </div>
        </div>
    </header>

    <main class="page">
        <h1>Quản trị</h1>
        <div id="admin-root"><div class="loading-state"><div class="spinner"></div></div></div>
    </main>

    <dialog id="course-dialog" class="dialog">
        <form onsubmit="saveCourse(event)">
            <h2 id="course-title">Môn học</h2>
            <label>Mã môn <input id="course-code" class="input" required maxlength="50"></label>
            <label>Tên môn <input id="course-name" class="input" required maxlength="200"></label>
            <div id="course-error" class="form-error" role="alert"></div>
            <div class="dialog-actions">
                <button type="button" class="btn" onclick="this.closest('dialog').close()">Hủy</button>
                <button type="submit" class="btn btn-primary">Lưu</button>
            </div>
        </form>
    </dialog>

    <dialog id="question-dialog" class="dialog dialog-wide">
        <form onsubmit="saveQuestion(event)">
            <h2 id="question-title">Câu hỏi</h2>
            <label>Nội dung (hoặc tên file ảnh trong /img, vd pic134.png)
                <textarea id="q-question" class="input" rows="3" required></textarea>
            </label>
            <div id="q-options"></div>
            <div id="question-error" class="form-error" role="alert"></div>
            <div class="dialog-actions">
                <button type="button" class="btn" onclick="this.closest('dialog').close()">Hủy</button>
                <button type="submit" class="btn btn-primary">Lưu</button>
            </div>
        </form>
    </dialog>

    <script src="common.js"></script>
    <script src="admin.js"></script>
</body>
</html>
